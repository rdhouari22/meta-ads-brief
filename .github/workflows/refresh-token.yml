name: Check Meta token

# This workflow only REPORTS how long your token has left.
# It never prints the token itself, because on a public repo
# every workflow log is readable by anyone.
#
# To actually refresh the token, see REFRESH-TOKEN.md — you do it
# in your browser, and the token never touches GitHub.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"        # every Monday, 07:00 Lagos

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: How long does the token have left?
        env:
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
        run: python meta_ads.py --token-info
